name: Bug report
description: Something in pramana doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `pramana --version`, your desktop (compositor) and distribution.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "`journalctl --user -u pramana -b` (it never contains your password)."
      render: text
